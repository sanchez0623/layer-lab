# layer-lab 容器内 nginx：同源网关
# 前端静态资源直接由 nginx 服务；/api 反代到同容器的 uvicorn(127.0.0.1:8010)。
# 对外只暴露本容器 3000 端口，HTTPS 反代层(limit-lab-https)把 3444 → 本容器 3000。

server {
    listen 3000;
    server_name _;

    # 前端产物根目录（Dockerfile 已把 Vite dist 拷到 /app/frontend/dist）
    root /app/frontend/dist;
    index index.html;

    # 上传的数据集 CSV 可能较大
    client_max_body_size 50m;

    # 后端 API 反代（同源，浏览器看到的始终是本站，无跨域/混合内容）
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 回测/选股刷新可能较慢
        proxy_send_timeout 300s;
    }

    # Vite 产物带 hash，可长缓存；index.html 不缓存以便发版立即生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 兜底：非 /api、非静态文件的路径全部回 index.html（前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}