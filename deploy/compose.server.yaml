# layer-lab · 阿里云 ECS 服务编排
# 应用容器：宿主机 3011 → 容器 3000（容器内 nginx 同源服务前端 + 反代 uvicorn）
# 数据（SQLite/CSV/上传/行情缓存）落在命名卷 layerlab-data，持久化、可备份。
# 用法：HOST_PORT=3011 docker compose -f deploy/compose.server.yaml --env-file .env up -d --build
# 说明：compose 文件在 deploy/ 下，构建上下文显式指回项目根（含 Dockerfile）。

services:
  layer-lab:
    build:
      context: ..
      dockerfile: Dockerfile
    image: layer-lab:latest
    container_name: layer-lab
    restart: unless-stopped
    # OOM 豁免：宿主机仅 1.8G RAM，夜间 quan 数据更新器的全表 flush 会顶高内存。
    # docker compose v2.27 不把 service 级 oom_score_adj 传给 HostConfig（实测 config 无此字段），
    # 因此改用「容器启动时自设」：command 里先 echo -800 > /proc/self/oom_score_adj 再 exec 原入口。
    # - cap_add SYS_RESOURCE：写负 oom_score_adj 需要该 cap（容器默认没有，实测写 -500 失败）
    # - command 覆盖：sh 设自身 -800 后 exec /app/deploy/start.sh，uvicorn/nginx 继承 -800
    # 更新器侧另有 oom_protect.sh 把自己 oom_score_adj 设 1000（OOM 时优先被杀、可续跑），双保险。
    cap_add:
      - SYS_RESOURCE
    command: ["/bin/sh", "-c", "echo -800 > /proc/self/oom_score_adj; exec /app/deploy/start.sh"]
    ports:
      - "${HOST_PORT:-3011}:3000"
    environment:
      # 后端数据落卷；行情缓存随卷持久化，避免重启重复拉取行情
      WB_DATA_DIR: /data
      WB_DB_PATH: /data/app.db
      # 历史日线/指数/5分钟从 quan_quant parquet 只读目录读取（服务器已同步 /srv/data/quan/history）
      WB_QUAN_DATA_DIR: /data/quan/history
      # 交易日历（同花顺 fuyao，含未来交易日）：判断周末/节假日是否轮询。
      # 也可把 key 写到数据卷 /data/fuyao_api_key（无需重建容器即可生效）。
      FUYAO_API_KEY: ${FUYAO_API_KEY:-}
      TZ: Asia/Shanghai
      UVICORN_HOST: 127.0.0.1
      UVICORN_PORT: 8010
    volumes:
      - layerlab-data:/data
      # quan_quant 只读数据（daily/adj_factor/index_daily/5分钟），不写回
      - /srv/data/quan:/data/quan:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  layerlab-data: