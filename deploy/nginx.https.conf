# layer-lab HTTPS 反代（部署在 ECS 上 /root/layer-lab-nginx.conf，由 layer-lab-https 容器挂载）
# 容器只暴露宿主机 3444 → 443 终结 TLS → 转发到 layer-lab 应用容器 (host.docker.internal:3011)。
# 注：不占宿主机 80（由 infra-web 持有）；下方 80 server 块保留以兼容 certbot webroot 挑战，
#     若容器未映射 80 则该块不生效，属预期。直接访问 https://47.119.50.139:3444。
# 复用 dividend-alpha 已签的 Let's Encrypt IP 证书（47.119.50.139，shortlived，由其 certbot cron 自动续期）。
# 本容器只读挂载证书目录，不参与签发。另加 HTTP Basic 认证兜底（凭据见 /root/layer-lab-auth.txt）。

server {
    listen 80;
    server_name _;
    # 证书续期 webroot 挑战（与 dividend-alpha / limit-lens 共用 certs 目录）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / { return 301 https://$host:3444$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/47.119.50.139/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.119.50.139/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP Basic 认证（htpasswd 文件由 deploy_aliyun.sh 在宿主机生成并挂载）
    auth_basic "LayerLab";
    auth_basic_user_file /etc/nginx/layer-lab.htpasswd;

    # 前端与 API 同源，全部反代到 layer-lab 应用容器（宿主机 3011）
    location / {
        proxy_pass http://host.docker.internal:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 回测/选股刷新较慢，放宽超时
        proxy_send_timeout 300s;
    }
}